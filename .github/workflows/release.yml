
name: Build B-Camera Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "4.2"

      - name: Prepare addon package
        shell: bash
        run: |
          set -e

          mkdir -p package dist

          # Root addon files
          cp __init__.py package/
          cp blender_manifest.toml package/
          cp registration.py package/
          cp constants.py package/
          cp helpers.py package/
          cp properties.py package/

          # Addon modules
          cp -r operators package/
          cp -r ui package/

          # Remove Python cache
          find package -type d -name "__pycache__" -prune -exec rm -rf {} +
          find package -type f -name "*.pyc" -delete

      - name: Validate addon source
        run: blender --command extension validate package

      - name: Build Blender Extension
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          blender --command extension build \
            --source-dir package \
            --output-filepath "dist/b-camera-${RELEASE_TAG}.zip"

      - name: Validate release ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          blender --command extension validate \
            "dist/b-camera-${RELEASE_TAG}.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/b-camera-${{ github.event.release.tag_name }}.zip
